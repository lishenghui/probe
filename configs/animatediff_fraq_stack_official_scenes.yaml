- &baseline
  inference_config: configs/inference/inference-v2.yaml
  motion_module: models/Motion_Module/mm_sd_v15_v2.ckpt
  motion_module_lora_configs:
    - {path: models/MotionLoRA/v2_lora_ZoomIn.ckpt, alpha: 0.60}
    - {path: models/MotionLoRA/v2_lora_PanRight.ckpt, alpha: 0.45}
    - {path: models/MotionLoRA/v2_lora_TiltUp.ckpt, alpha: 0.35}
    - {path: models/MotionLoRA/v2_lora_RollingClockwise.ckpt, alpha: 0.25}
  dreambooth_path: models/DreamBooth_LoRA/realisticVisionV60B1_v51VAE.safetensors
  seed: [8964153601421814582, 10589116295929063558, 3460258020075528001]
  steps: 25
  guidance_scale: 7.5
  prompt: &prompts
    - "b&w photo of 42 y.o man in black clothes, bald, face, half body, body, high detailed skin, skin pores, coastline, overcast weather, wind, waves, 8k uhd, dslr, soft lighting, high quality, film grain, Fujifilm XT3"
    - "close up photo of a rabbit, forest, haze, halation, bloom, dramatic atmosphere, centred, rule of thirds, 200mm 1.4f macro shot"
    - "night, b&w photo of old house, post apocalypse, forest, storm weather, wind, rocks, 8k uhd, dslr, soft lighting, high quality, film grain"
  n_prompt: &negative_prompts
    - "semi-realistic, cgi, 3d, render, sketch, cartoon, drawing, anime, text, cropped, out of frame, worst quality, low quality, jpeg artifacts, ugly, duplicate, mutated hands, poorly drawn hands, poorly drawn face, mutation, deformed, blurry, bad anatomy, bad proportions, extra limbs, disfigured"
    - "semi-realistic, cgi, 3d, render, sketch, cartoon, drawing, anime, text, cropped, out of frame, worst quality, low quality, jpeg artifacts, ugly, duplicate, mutated hands, poorly drawn hands, poorly drawn face, mutation, deformed, blurry, bad anatomy, bad proportions, extra limbs, disfigured"
    - "blur, haze, deformed iris, deformed pupils, semi-realistic, cgi, 3d, render, sketch, cartoon, drawing, anime, art, distorted, disfigured, poorly drawn, bad anatomy, wrong anatomy, extra limb, missing limb, mutation, ugly"
  W: 512
  H: 512
  L: 16

- &compressed
  <<: *baseline
  motion_module_lora_configs: [{path: models/MotionLoRA/fraq/motionlora_stack_fraq_e95.ckpt, alpha: 1.0}]
  prompt: *prompts
  n_prompt: *negative_prompts
- <<: *compressed
  motion_module_lora_configs: [{path: models/MotionLoRA/fraq/motionlora_stack_fraq_e90.ckpt, alpha: 1.0}]
- <<: *compressed
  motion_module_lora_configs: [{path: models/MotionLoRA/fraq/motionlora_stack_fraq_e80.ckpt, alpha: 1.0}]
- <<: *compressed
  motion_module_lora_configs: [{path: models/MotionLoRA/fraq/motionlora_stack_fraq_e70.ckpt, alpha: 1.0}]
